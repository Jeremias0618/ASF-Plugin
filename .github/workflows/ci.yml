name: Plugin CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: never grant write on PR / fork workflows.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: "10.0.x"

jobs:
  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Resolve ASF target version
        id: asf
        shell: bash
        run: |
          set -euo pipefail
          ver="$(sed -n 's/.*<ASFTargetVersion>\([^<]*\)<\/ASFTargetVersion>.*/\1/p' Directory.Build.props | head -n1)"
          if [[ -z "$ver" ]]; then
            echo "::error::ASFTargetVersion not found in Directory.Build.props"
            exit 1
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ASFTargetVersion '$ver' is not a valid ASF version tag"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building against ASF $ver"

      - name: Checkout ArchiSteamFarm
        uses: actions/checkout@v7
        with:
          repository: JustArchiNET/ArchiSteamFarm
          ref: ${{ steps.asf.outputs.version }}
          path: ArchiSteamFarm
          persist-credentials: false
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Verify .NET
        run: dotnet --info

      - name: Restore
        run: dotnet restore ASFBotSocial.sln --nologo

      - name: Build Release
        run: >
          dotnet build ASFBotSocial/ASFBotSocial.csproj
          -c Release
          --nologo
          -p:ASFTargetVersion=${{ steps.asf.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          --no-restore

      - name: Verify ASF tag + assembly bind
        shell: pwsh
        run: >
          ./.github/scripts/Verify-AsfBind.ps1
          -PluginDll "ASFBotSocial/bin/Release/net10.0/ASFBotSocial.dll"
          -ExpectedAsfVersion "${{ steps.asf.outputs.version }}"
          -AsfCheckoutPath "ArchiSteamFarm"

      - name: Upload Release DLL
        uses: actions/upload-artifact@v7
        with:
          name: ASFBotSocial-dll
          path: ASFBotSocial/bin/Release/net10.0/ASFBotSocial.dll
          if-no-files-found: error
          retention-days: 14
