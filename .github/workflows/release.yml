name: Plugin Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v1.1.51). Leave empty when triggered by tag push."
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: "10.0.x"

jobs:
  release:
    name: Pack and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Resolve ASF target version
        id: asf
        shell: bash
        run: |
          set -euo pipefail
          ver="$(sed -n 's/.*<ASFTargetVersion>\([^<]*\)<\/ASFTargetVersion>.*/\1/p' Directory.Build.props | head -n1)"
          if [[ -z "$ver" ]]; then
            echo "::error::ASFTargetVersion not found in Directory.Build.props"
            exit 1
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid ASFTargetVersion '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Packaging plugin for ASF $ver"

      - name: Checkout ArchiSteamFarm
        uses: actions/checkout@v7
        with:
          repository: JustArchiNET/ArchiSteamFarm
          ref: ${{ steps.asf.outputs.version }}
          path: ArchiSteamFarm
          persist-credentials: false
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build Release
        run: >
          dotnet build ASFBotSocial/ASFBotSocial.csproj
          -c Release
          --nologo
          -p:ASFTargetVersion=${{ steps.asf.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Verify ASF tag + assembly bind
        shell: pwsh
        run: >
          ./.github/scripts/Verify-AsfBind.ps1
          -PluginDll "ASFBotSocial/bin/Release/net10.0/ASFBotSocial.dll"
          -ExpectedAsfVersion "${{ steps.asf.outputs.version }}"
          -AsfCheckoutPath "ArchiSteamFarm"

      - name: Pack ZIP
        shell: pwsh
        run: |
          $dll = "ASFBotSocial/bin/Release/net10.0/ASFBotSocial.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          New-Item -ItemType Directory -Force -Path dist/ASFBotSocial | Out-Null
          Copy-Item -Force $dll dist/ASFBotSocial/
          if (Test-Path dist/ASFBotSocial.zip) { Remove-Item -Force dist/ASFBotSocial.zip }
          Compress-Archive -Path dist/ASFBotSocial/* -DestinationPath dist/ASFBotSocial.zip -Force
          if (-not (Test-Path dist/ASFBotSocial.zip)) { throw "ZIP was not created" }

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if release already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.guard.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          fail_on_unmatched_files: true
          body: |
            Compatible with **ArchiSteamFarm ${{ steps.asf.outputs.version }}** (exact strong-name match required).

            CI verified: ASF git tag + plugin assembly reference bind.

            Install: extract `ASFBotSocial.zip` into `plugins/ASFBotSocial/` next to `ArchiSteamFarm.exe`.
          files: dist/ASFBotSocial.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
